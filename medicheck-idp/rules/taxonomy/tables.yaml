          - {canonical: name_designation}
          - {canonical: laboratory}
          - {canonical: class_of_drugs_or_device}

  - id: Q
    name: "Stability Study Design"
    default_class: non_usable
    priority: P3
    columns_status: complete
    matchable: true
    layouts:
      - layout_id: Q.standard
        columns:
