<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medicine Scanner — Regulatory Search</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --red: #ef4444;
    --yellow: #eab308;
    --green: #22c55e;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 16px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  .req { color: var(--red); }
  input {
    display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #0b1220; color: var(--text);
    font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  input::placeholder { color: #64748b; font-style: italic; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
  button {
    margin-top: 8px; padding: 11px 20px; border: 0; border-radius: 8px;
    background: var(--accent); color: #0b1220; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: progress; }
  .status { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; }
  .RED    { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid var(--red); }
  .YELLOW { background: rgba(234,179,8,0.15); color: var(--yellow); border: 1px solid var(--yellow); }
  .GREEN  { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid var(--green); }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-word; }
  pre { background: #0b1220; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .err { color: var(--red); font-size: 13px; }
  h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .hint { font-size: 12px; color: var(--muted); margin: -6px 0 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💊 Medicine Scanner</h1>
  <p class="sub">Read-only regulatory search. Not medical advice. Not a safety certification.</p>

  <form id="form" class="card" autocomplete="off">
    <label>Medicine name <span class="req">*</span>
      <input name="medicine_name" placeholder="e.g. Ticagrelor Tablets" autocomplete="off" />
    </label>
    <div class="row">
      <label>Batch number
        <input name="batch_number" placeholder="e.g. MT230087" autocomplete="off" />
      </label>
      <label>Active ingredient / composition
        <input name="active_ingredient" placeholder="e.g. Paracetamol" autocomplete="off" />
      </label>
    </div>
    <div class="hint">
      Fields left blank are not sent. Batch is required for a batch-specific regulatory result.
    </div>
    <button id="go" type="submit">Scan</button>
  </form>

  <details id="echo" class="card" style="margin-bottom:16px">
    <summary>Request body actually sent</summary>
    <pre id="echoBody" style="margin-top:8px">{}</pre>
  </details>

  <div id="out"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const form = $("#form");
const out = $("#out");
const goBtn = $("#go");
const echoBody = $("#echoBody");
const echoPanel = $("#echo");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const body = {};
  for (const [k, v] of fd.entries()) {
    const t = (v ?? "").trim();
    if (t) body[k] = t;
  }

  // Always echo exactly what will be sent.
  echoBody.textContent = JSON.stringify(body, null, 2);
  echoPanel.open = true;

  if (!body.medicine_name && !body.active_ingredient) {
    out.innerHTML = `<div class="card err">Provide a medicine name or an active ingredient.</div>`;
    return;
  }
  goBtn.disabled = true;
  out.innerHTML = `<div class="card">Scanning…</div>`;
  try {
    const res = await fetch("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      out.innerHTML = `<div class="card err">Error ${res.status}: ${escape(JSON.stringify(data))}</div>`;
    } else {
      out.innerHTML = render(data);
    }
  } catch (err) {
    out.innerHTML = `<div class="card err">Network error: ${escape(String(err))}</div>`;
  } finally {
    goBtn.disabled = false;
  }
});

function escape(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(r) {
  const color = (r.result?.color || "GREEN").toUpperCase();
  const title = r.result?.title || "";
  const status = r.result?.status || "";
  const severity = r.result?.severity || "";
  const safety = r.safety?.message || "";
  const safetyAssess = r.safety?.assessment || "";

  const med = r.medicine || {};
  const batch = r.batch || {};

  let html = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div>
          <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">
            Result
          </div>
          <div style="font-size:18px;font-weight:600;margin-top:2px">${escape(title)}</div>
        </div>
        <span class="status ${color}">${color} · ${escape(severity)}</span>
      </div>
      <div style="margin-top:14px" class="kv">
        <dt>Status</dt><dd>${escape(status)}</dd>
        <dt>Match</dt><dd>${escape((r.match?.type||"") + " · " + (r.match?.confidence ?? ""))}</dd>
        <dt>Medicine</dt><dd>${escape(med.name || "—")}${med.id ? ` <span style="color:var(--muted)">(#${med.id})</span>` : ""}</dd>
        <dt>Manufacturer</dt><dd>${escape(med.manufacturer || "—")}</dd>
        <dt>Batch</dt><dd>${escape(batch.number || "—")}${batch.id ? ` <span style="color:var(--muted)">(#${batch.id})</span>` : ""}</dd>
        <dt>Expiry</dt><dd>${escape(batch.expiry_date || "—")}</dd>
      </div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Safety</div>
        <div style="margin-top:4px">${escape(safetyAssess)} — ${escape(safety)}</div>
      </div>
    </div>
  `;

  if (r.candidates && r.candidates.length) {
    html += `<div class="card"><h3>Candidates</h3>`;
    for (const c of r.candidates) {
      html += `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <b>${escape(c.name)}</b> <span style="color:var(--muted)">(#${c.product_id}, score ${c.score})</span>
        <div style="font-size:12px;color:var(--muted)">${escape(c.manufacturer || "")}</div>
      </div>`;
    }
    html += `</div>`;
  }

  if (r.matches && r.matches.length) {
    html += `<div class="card"><h3>Regulatory matches (${r.matches.length})</h3>`;
    for (const m of r.matches) {
      const rg = m.regulatory || {};
      const gs = m.government_statement || {};
      const src = m.source || {};
      html += `
        <div style="padding:14px 0;border-top:1px solid var(--border)">
          <div style="font-weight:600">${escape(rg.event_type || "")} — ${escape(rg.status || "")}
            <span style="color:var(--muted);font-weight:400">(${escape(rg.scope || "")})</span>
          </div>
          <dl class="kv" style="margin-top:8px">
            <dt>Reason</dt><dd>${escape(rg.reason || "—")}</dd>
            <dt>Action</dt><dd>${escape(rg.action || "—")}</dd>
            <dt>Legal status</dt><dd>${escape(rg.legal_status || "—")}</dd>
            <dt>Effective date</dt><dd>${escape(rg.effective_date || "—")}</dd>
            <dt>Legal reference</dt><dd>${escape(rg.legal_reference || "—")}</dd>
            <dt>Authority</dt><dd>${escape(gs.authority || "—")}</dd>
            <dt>Summary</dt><dd>${escape(gs.summary || "—")}</dd>
            <dt>Document</dt><dd>${escape(src.document_type || "")} — ${escape(src.title || "")}</dd>
            <dt>PDF</dt><dd>${src.pdf_url ? `<a href="${escape(src.pdf_url)}" target="_blank" rel="noopener" style="color:var(--accent)">${escape(src.pdf_filename || "open")}</a>` : escape(src.pdf_filename || "—")}</dd>
            <dt>Published</dt><dd>${escape(src.publication_date || "—")}</dd>
          </dl>
        </div>`;
    }
    html += `</div>`;
  }

  html += `<details><summary>Raw JSON</summary><pre>${escape(JSON.stringify(r, null, 2))}</pre></details>`;
  return html;
}
</script>
</body>
</html>
